# nginx site config for MCP server bearer-auth front
# Installed at /etc/nginx/sites-available/mcp by setup.sh
# setup.sh substitutes ${MCP_BACKEND_BEARER_TOKEN} with the contents of /mcp/config/bearer.secret

server {
    listen      8080 default_server;
    listen [::]:8080 default_server;

    # TLS listener for direct private-link path (Foundry → ILB → VM).
    # Cert and key are generated by bootstrap.sh / step-1 of the PLS work.
    listen      8443 ssl;
    listen [::]:8443 ssl;
    ssl_certificate     /mcp/config/mcp-tls.crt;
    ssl_certificate_key /mcp/config/mcp-tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Health endpoints — no auth.
    # /healthz       — used directly by the AppGW probe (probe path is set to /healthz)
    # /mcp/healthz   — useful for end-to-end testing through AppGW (which forwards /mcp/* with prefix intact)
    location = /healthz {
        access_log off; default_type text/plain; return 200 "ok\n";
    }
    location = /mcp/healthz {
        access_log off; default_type text/plain; return 200 "ok\n";
    }

    # MCP traffic via AppGW — bearer required, /mcp/ prefix stripped before forwarding to mcp-proxy.
    # AppGW preserves the request path, so requests arrive here as /mcp/sse, /mcp/messages/...
    # The trailing slash on proxy_pass tells nginx to strip the matched location prefix.
    location ^~ /mcp/ {
        if ($http_authorization != "Bearer ${MCP_BACKEND_BEARER_TOKEN}") { return 401; }
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering           off;
        proxy_cache               off;
        proxy_read_timeout        24h;
        proxy_send_timeout        24h;
        chunked_transfer_encoding off;
    }

    # Direct internal access (e.g. curl from inside vnet at root paths /sse, /messages/...) — same auth.
    location / {
        if ($http_authorization != "Bearer ${MCP_BACKEND_BEARER_TOKEN}") { return 401; }
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering           off;
        proxy_cache               off;
        proxy_read_timeout        24h;
        proxy_send_timeout        24h;
        chunked_transfer_encoding off;
    }
}


# ---------------------------------------------------------------------------
# Anonymous server block on :80 ONLY — Foundry MCP custom-tool runtime drops
# both the configured port (rewrites :8080 -> :80) and the Authorization
# header in flight. Security boundary for this listener is network isolation:
# the VNet is private, no public IP on this VM, and the only callers are
# agents injected into the Foundry agent subnet. The DB user MCP_READER is
# read-only against curated MCP_VIEWS. Bearer auth is preserved on :8080,
# :8443, and the /mcp/* path served by AppGW.
# Added 2026-04-28.
# ---------------------------------------------------------------------------
server {
    listen      80;
    listen [::]:80;
    listen      443 ssl;
    listen [::]:443 ssl;
    ssl_certificate     /mcp/config/mcp-tls.crt;
    ssl_certificate_key /mcp/config/mcp-tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;


    location = /healthz {
        access_log off; default_type text/plain; return 200 "ok\n";
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering           off;
        proxy_cache               off;
        proxy_read_timeout        24h;
        proxy_send_timeout        24h;
        chunked_transfer_encoding off;
    }
}
