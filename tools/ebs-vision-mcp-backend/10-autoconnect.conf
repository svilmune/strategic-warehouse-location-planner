# The SQLcl MCP server starts with no DB connection and its connection state is
# process-global but cleared on restart. Prime it once on startup via the MCP
# connect tool so run-sql works immediately and restarts self-heal.
# (-name on ExecStart does NOT reach the MCP tool layer.)
[Service]
ExecStartPost=-/mcp/venv/bin/python /mcp/mcp-connect-primer.py
